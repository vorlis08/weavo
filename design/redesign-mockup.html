<!doctype html>
<!-- Weavo redesign — clickable mockup (27. 9. 2026). Design reference for the upcoming visual overhaul; not part of the app build. Live: https://claude.ai/artifact/GqEbk1YeA9iZhJywa2carm -->
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Weavo Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0F0F13; --side:#121217; --s1:#17171D; --s2:#1E1E26; --s3:#272730; --s4:#31313B;
  --line:rgba(255,255,255,.065); --line2:rgba(255,255,255,.11); --line3:rgba(255,255,255,.18);
  --t1:#EFEEF4; --t2:#B0AEBF; --t3:#8A889E; --t4:#5E5C70;
  --acc:#9EA0F7; --acc2:#B6B8FF; --acc-ink:#12121C; --acc-soft:rgba(158,160,247,.13);
  --p:#6FD0B0; --w:#E7B45F; --flame:#FF7A59; --danger:#F2838F;
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --sans:'Hanken Grotesk',-apple-system,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}
svg.i.xs{width:13px;height:13px}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--t3);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;line-height:1.4}

/* ------- shell ------- */
.app{display:flex;height:100%}
.side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--s2);border:1px solid var(--line2);display:grid;place-items:center}
.capture{display:flex;align-items:center;gap:10px;height:38px;border-radius:10px;background:var(--s1);border:1px solid var(--line2);padding:0 10px 0 12px;color:var(--t2);font-size:13.5px;margin-bottom:18px;transition:border-color .15s,background .15s}
.capture:hover{border-color:var(--line3);background:var(--s2);color:var(--t1)}
.capture .plus{width:20px;height:20px;border-radius:6px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.capture .kbd{margin-left:auto}
.nav{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:9px;color:var(--t2);font-size:14px;font-weight:500;width:100%;transition:background .15s,color .15s}
.nav:hover{background:var(--s1);color:var(--t1)}
.nav.on{background:var(--s2);color:var(--t1)}
.nav.on svg{color:var(--acc)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--t3)}
.side-sec{display:flex;align-items:center;gap:8px;padding:22px 10px 6px;font-size:12px;color:var(--t3);font-weight:500}
.side-sec .thread{width:14px;height:2px;border-radius:2px}
.pnav{display:flex;align-items:center;gap:11px;height:32px;padding:0 10px;border-radius:8px;color:var(--t2);font-size:13.5px;width:100%}
.pnav:hover{background:var(--s1);color:var(--t1)}
.pnav.on{background:var(--s2);color:var(--t1)}
.pnav .cnt{margin-left:auto;font-size:12px;color:var(--t3)}
.sq{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--t2);font-size:13px}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#2A2A36,#3A3A4A);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--t1)}

.main{flex:1;min-width:0;overflow-y:auto;position:relative}
.banner{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 40px;background:rgba(15,15,19,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-size:12px;color:var(--t3)}
.banner .pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--line2);color:var(--t2)}
.banner button{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;color:var(--acc2);background:var(--acc-soft)}
.page{max-width:1140px;margin:0 auto;padding-inline:40px;padding-block:34px 110px}

/* ------- page header ------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.eyebrow{font-size:13px;color:var(--t3);margin-bottom:6px}
.eyebrow b{color:var(--t2);font-weight:500}
h1.d{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.08;letter-spacing:-.03em;margin:0;text-wrap:balance}
.lede{color:var(--t2);font-size:14.5px;max-width:64ch;margin:10px 0 0}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* controls */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:10px;background:var(--s1);border:1px solid var(--line)}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--t3);display:inline-flex;align-items:center;gap:7px;transition:color .15s,background .15s}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--s3);color:var(--t1)}
.thr{width:12px;height:2px;border-radius:2px;background:var(--c)}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:500;border:1px solid var(--line2);color:var(--t1);transition:background .15s,border-color .15s}
.btn:hover{background:var(--s2);border-color:var(--line3)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--acc-ink);font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.ghost{border-color:transparent;color:var(--t2)}
.btn.ghost:hover{color:var(--t1);background:var(--s1)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--t3)}
.icon-btn:hover{background:var(--s2);color:var(--t1)}

/* ------- task rows ------- */
.sect{margin-bottom:30px}
.sh{display:flex;align-items:baseline;gap:10px;padding:0 12px 8px;font-size:13px;font-weight:600;color:var(--t2)}
.sh .n{font-weight:500;color:var(--t3);font-size:12.5px}
.sh .hint{margin-left:auto;font-weight:400;color:var(--t3);font-size:12.5px}
.sh.hot{color:var(--flame)}
.sh .tog{display:flex;align-items:center;gap:8px}
.sh .tog svg{transition:transform .2s var(--ease)}
.sh .tog.open svg{transform:rotate(90deg)}
.rows{display:flex;flex-direction:column}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 10px 8px 12px;border-radius:11px;cursor:pointer;transition:background .15s}
.row:hover{background:var(--s1)}
.row + .row::before{content:"";position:absolute;top:0;left:44px;right:10px;height:1px;background:var(--line)}
.row:hover::before,.row:hover + .row::before{opacity:0}
.row .thread{position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--c)}
.ck{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--t4);flex:none;display:grid;place-items:center;transition:border-color .15s,background .2s var(--ease),transform .15s}
.ck:hover{border-color:var(--t2)}
.ck:active{transform:scale(.9)}
.ck svg{width:11px;height:11px;stroke:transparent;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row.done .ck{background:var(--acc);border-color:var(--acc)}
.row.done .ck svg{stroke:var(--acc-ink)}
.row .body{flex:1;min-width:0}
.row .ti{font-size:14.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.row.done .ti{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t4)}
.pri{color:var(--danger);font-weight:700;margin-right:5px}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:12.5px;color:var(--t3)}
.meta:empty{display:none}
.m{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.m.danger{color:var(--danger)}
.m.lead{color:var(--p)}
.m.today{color:var(--t2)}
.m.wait{color:var(--t2)}
.m.wait svg{color:var(--w)}
.fl{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--t4);opacity:0;transition:opacity .15s,color .15s,background .15s;flex:none}
.row:hover .fl,.fl.on,.fl:focus-visible{opacity:1}
.fl:hover{background:var(--s3);color:var(--t2)}
.fl.on{color:var(--flame)}
.fl.on svg{fill:rgba(255,122,89,.28)}
.empty{padding:12px 12px 4px 44px;color:var(--t3);font-size:13.5px}
.add{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:11px;color:var(--t3);font-size:14px;width:100%}
.add:hover{background:var(--s1);color:var(--t2)}
.add .ring{width:20px;height:20px;border-radius:50%;border:1.6px dashed var(--t4);display:grid;place-items:center}
.quick{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);margin-bottom:26px;color:var(--t3);font-size:14.5px}
.quick:focus-within{border-color:var(--line3)}
.quick input{flex:1;background:none;border:0;outline:0;color:var(--t1);font-size:14.5px;min-width:0}
.quick input::placeholder{color:var(--t3)}

/* progress thread */
.pt{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.pt .track{position:relative;flex:1;height:4px;border-radius:4px;background:var(--s3);overflow:hidden;display:flex}
.pt .track i{display:block;height:100%;transition:width .45s var(--ease)}
.pt .lbl{font-size:13px;color:var(--t2);white-space:nowrap}
.pt .lbl b{color:var(--t1);font-weight:600}

/* space tabs */
.stabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.stab{position:relative;display:flex;align-items:center;gap:10px;padding:0 2px 12px;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--t3);transition:color .15s}
.stab:hover{color:var(--t2)}
.stab.on{color:var(--t1)}
.stab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.stab.on::after{transform:scaleX(1)}
.stab .n{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--t2);background:var(--s2);border-radius:999px;padding:1px 8px}

/* events strip */
.evs{display:flex;gap:8px;overflow-x:auto;margin:-6px 0 26px;padding-bottom:2px}
.ev{flex:none;display:flex;align-items:center;gap:10px;height:36px;padding:0 14px 0 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:13.5px}
.ev .bar{width:2px;height:16px;border-radius:2px;background:var(--c)}
.ev time{color:var(--t3);font-size:12.5px}
.ev.past{opacity:.5}

/* ------- home ------- */
.hgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:36px;align-items:start}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.card h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-weight:500;color:var(--acc2);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.rituals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:34px}
.rit{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left;transition:border-color .15s,background .15s}
.rit:hover{border-color:var(--line3);background:var(--s2)}
.rit .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.rit b{display:block;font-size:14.5px;font-weight:600}
.rit small{display:block;color:var(--t3);font-size:12.5px;margin-top:1px}
.rit.suggest{border-color:rgba(231,180,95,.35)}
.today-num{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:600;letter-spacing:-.03em}
.today-num b{font-size:44px;line-height:1}
.today-num span{font-size:17px;color:var(--t3)}
.threads2{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.th2{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:10px;font-size:12.5px;color:var(--t2)}
.th2 .track{height:3px;border-radius:3px;background:var(--s3);overflow:hidden}
.th2 .track i{display:block;height:100%;background:var(--c);transition:width .45s var(--ease)}
.th2 .v{text-align:right;color:var(--t3)}
.agenda{position:relative;display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:48px 2px 1fr;gap:12px;align-items:center;min-height:40px;font-size:13.5px;cursor:pointer;border-radius:8px}
.ag time{color:var(--t3);font-size:12.5px;text-align:right}
.ag .bar{height:22px;border-radius:2px;background:var(--c)}
.ag .sub{color:var(--t3);font-size:12px}
.ag.past{opacity:.45}
.now{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;margin:2px 0}
.now span{font-size:11.5px;color:var(--acc2);text-align:right;font-weight:600}
.now i{height:1px;background:var(--acc);position:relative}
.now i::before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.pmini{display:flex;flex-direction:column;gap:12px}
.pm{display:grid;grid-template-columns:1fr auto;gap:6px 12px;cursor:pointer}
.pm .nm{display:flex;align-items:center;gap:9px;font-size:13.5px;min-width:0}
.pm .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm .dd{font-size:12.5px;color:var(--t3);text-align:right}
.pm .track{grid-column:1 / -1;height:3px;border-radius:3px;background:var(--s3);overflow:hidden}
.pm .track i{display:block;height:100%;background:var(--c)}

/* ------- projects list ------- */
.pgroup{margin-bottom:34px}
.pgh{display:flex;align-items:center;gap:10px;padding:0 14px 10px;font-size:13px;font-weight:600;color:var(--t2)}
.pgh .thr{width:18px}
.pgh .n{color:var(--t3);font-weight:500}
.pgh .tog{display:flex;align-items:center;gap:10px}
.pgh .tog svg{transition:transform .2s var(--ease)}
.pgh .tog.open svg{transform:rotate(90deg)}
.ptable{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 170px 128px 150px 72px;gap:20px;align-items:center;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.prow:hover{background:var(--s1)}
.pcol-h{display:grid;grid-template-columns:minmax(0,1fr) 170px 128px 150px 72px;gap:20px;padding:0 14px 14px;font-size:12px;color:var(--t3)}
.pname{display:flex;align-items:center;gap:11px;min-width:0}
.pname .sq{width:11px;height:11px;border-radius:3.5px}
.pname b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnext{display:flex;align-items:center;gap:7px;margin:4px 0 0 22px;font-size:13px;color:var(--t2);min-width:0}
.pnext span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnext .lbl{color:var(--t3);flex:none}
.pnext svg{color:var(--flame);flex:none}
.status{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--s2);color:var(--t2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.status.active{color:var(--t1)}
.status.active i{background:var(--acc)}
.status.paused{color:var(--t3)}
.status.done{color:var(--t3)}
.status.done i{background:var(--t3)}
.due b{display:block;font-size:13.5px;font-weight:500}
.due small{display:block;font-size:12.5px;color:var(--t3)}
.due.soon small{color:var(--w)}
.due.late small{color:var(--danger)}
.prog{display:flex;align-items:center;gap:10px}
.prog .track{flex:1;height:4px;border-radius:4px;background:var(--s3);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--c);border-radius:4px}
.prog span{font-size:12.5px;color:var(--t2);min-width:36px;text-align:right}
.sig{display:flex;gap:10px;justify-content:flex-end;font-size:12.5px;color:var(--t2)}
.sig span{display:inline-flex;align-items:center;gap:4px}
.sig .f{color:var(--flame)}
.sig .h svg{color:var(--w)}
.sig .none{color:var(--t4)}

/* portfolio osnova */
.loom{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--s1);padding:14px 16px 12px;overflow:hidden}
.loom-scroll{overflow-x:auto}
.loom-inner{position:relative;min-width:760px}
.axis{display:grid;height:26px;border-bottom:1px solid var(--line);font-size:12px;color:var(--t3)}
.axis div{padding-left:6px;border-left:1px solid var(--line);white-space:nowrap}
.lane{position:relative;display:grid;grid-template-columns:200px 1fr;align-items:center;height:44px}
.lane + .lane{border-top:1px solid var(--line)}
.lane .ln{display:flex;align-items:center;gap:10px;font-size:13.5px;min-width:0;padding-right:12px;cursor:pointer}
.lane .ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .ln small{color:var(--t3);font-size:12px;margin-left:auto;flex:none}
.lane .tr{position:relative;height:100%}
.bar-l{position:absolute;top:50%;height:12px;transform:translateY(-50%);border-radius:12px;overflow:hidden;background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--c) 42%,transparent) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 50%,transparent);cursor:pointer}
.bar-l i{display:block;height:100%;background:var(--c);border-radius:12px 0 0 12px}
.bar-l.paused{filter:saturate(.2) brightness(.8)}
.flag{position:absolute;top:50%;width:2px;height:22px;transform:translate(-1px,-50%);background:var(--c);border-radius:2px}
.needle{position:absolute;top:0;bottom:0;width:1px;background:var(--acc);pointer-events:none}
.needle::before{content:attr(data-l);position:absolute;top:-2px;left:6px;font-size:11px;font-weight:600;color:var(--acc2)}
.weekend{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.018)}

/* ------- project detail ------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3);margin-bottom:14px}
.crumb button:hover{color:var(--t1)}
.ptitle{display:flex;align-items:center;gap:14px}
.ptitle .sq{width:16px;height:16px;border-radius:5px}
.props{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.prop{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:9px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--t2);transition:border-color .15s}
.prop:hover{border-color:var(--line3);color:var(--t1)}
.prop b{color:var(--t1);font-weight:500}
.prop .k{color:var(--t3)}

/* ============ selectors ============ */
const open=t=>!t.done;
const lead=t=>t.tag&&TAGS[t.tag].lead||0;
const onToday=t=>!t.someday&&!t.waiting&&t.due!=null&&t.due<=lead(t)&&(!t.done||t.due>=-1);
const over=t=>open(t)&&t.due!=null&&t.due<0;
const hot=t=>open(t)&&!t.someday&&!t.waiting&&(t.flame||over(t));
const inF=(x,f)=>f==='all'||x.space===f;
const byU=(a,b)=>(a.done-b.done)||(b.flame-a.flame)||(b.prio-a.prio)||((a.due??99)-(b.due??99));
const fmtH=h=>`${Math.floor(h)}:${String(Math.round((h%1)*60)).padStart(2,'0')}`;
const pTasks=id=>S.tasks.filter(t=>t.proj===id&&!t.someday);
function pStats(id){
  const p=PR[id];if(p.doneStat)return{d:p.doneStat[0],n:p.doneStat[1]};
  const a=pTasks(id);return{d:a.filter(t=>t.done).length,n:a.length};
}
const pNext=id=>pTasks(id).filter(t=>open(t)&&!t.waiting).sort(byU)[0];
const byId=id=>S.tasks.find(t=>t.id===+id);

/* ============ pieces ============ */
function dueMeta(t,ctx){
  if(t.due==null)return '';
  if(t.done&&ctx!=='drawer')return '';
  if(t.due<0)return `<span class="m danger">po termínu · ${dayName(t.due)}</span>`;
  if(t.due>0&&t.due<=lead(t)&&ctx==='today')return `<span class="m lead">na ${ACC[dOf(t.due).getDay()]} · ${short(t.due)}</span>`;
  if(t.due===0)return (ctx==='today'&&!t.time)?'':`<span class="m today">dnes${t.time?' '+t.time:''}</span>`;
  return `<span class="m">${dayName(t.due)}${t.time?' '+t.time:''}</span>`;
}
function metaHTML(t,o={}){
  const parts=[];
  if(t.proj&&!o.hideProj){const p=PR[t.proj];parts.push(`<span class="m"><i class="sq" style="--c:${p.color}"></i>${p.short||p.name}</span>`)}
  if(t.tag&&!o.hideTag)parts.push(`<span class="m">#${TAGS[t.tag].name}</span>`);
  parts.push(dueMeta(t,o.ctx));
  if(t.repeat)parts.push(`<span class="m">${ic('repeat','xs')}${t.repeat}</span>`);
  if(t.waiting)parts.push(`<span class="m wait">${ic('hour','xs')}${t.waiting.who} · ${-t.waiting.since} ${cz(-t.waiting.since,['den','dny','dní'])}</span>`);
  if(t.steps){const d=t.steps.filter(s=>s[1]).length;parts.push(`<span class="m">${d}/${t.steps.length} kroků</span>`)}
  return parts.filter(Boolean).join('');
}
function row(t,o={}){
  return `<div class="row ${t.done?'done':''}" data-open="${t.id}">
    ${o.thread?`<span class="thread" style="--c:${SP[t.space].c}"></span>`:''}
    <button class="ck" data-done="${t.id}" aria-label="${t.done?'Označit jako neudělané':'Hotovo'}">${CK}</button>
    <div class="body"><div class="ti">${t.prio===3&&!t.done?'<span class="pri" title="Vysoká priorita">!</span>':''}${t.title}</div><div class="meta">${metaHTML(t,o)}</div></div>
    <button class="fl ${t.flame?'on':''}" data-flame="${t.id}" title="${t.flame?'Už nehoří':'Hoří'}" aria-pressed="${t.flame}">${ic('flame','s')}</button>
  </div>`;
}
const rows=(a,o={})=>a.length?`<div class="rows">${a.map(t=>row(t,o)).join('')}</div>`:(o.empty?`<div class="empty">${o.empty}</div>`:'');
function sect(title,a,o={}){
  if(!a.length&&!o.empty&&!o.always)return '';
  const n=a.filter(open).length;
  if(o.key){
    const isOpen=!S.collapsed[o.key];
    return `<section class="sect"><div class="sh ${o.hot?'hot':''}"><button class="tog ${isOpen?'open':''}" data-coll="${o.key}">${ic('chev','xs')}${o.icon?ic(o.icon,'s'):''}${title}<span class="n">${n}</span></button>${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>${isOpen?rows(a,o):''}</section>`;
  }
  return `<section class="sect"><div class="sh ${o.hot?'hot':''}">${o.icon?ic(o.icon,'s'):''}${o.dot?`<i class="thr" style="--c:${o.dot}"></i>`:''}${title}<span class="n">${n}</span>${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>${rows(a,o)}</section>`;
}
function progressThread(list,split){
  const n=list.length||1,d=list.filter(t=>t.done).length;
  const bars=split
    ?`<i style="width:${list.filter(t=>t.done&&t.space==='personal').length/n*100}%;background:var(--p)"></i><i style="width:${list.filter(t=>t.done&&t.space==='work').length/n*100}%;background:var(--w)"></i>`
    :`<i style="width:${d/n*100}%;background:${split===false?'var(--acc)':'var(--acc)'}"></i>`;
  return `<div class="pt"><div class="track">${bars}</div><span class="lbl"><b>${d}</b> z ${list.length} hotovo</span></div>`;
}
function dueCell(p){
  if(p.due==null)return `<div class="due"><b>—</b><small>průběžný</small></div>`;
  const cls=p.status==='done'?'':p.due<0?'late':p.due<=7?'soon':'';
  const sub=p.status==='done'?'uzavřeno':p.due<0?`po termínu ${-p.due} ${cz(-p.due,['den','dny','dní'])}`:rel(p.due);
  return `<div class="due ${cls}"><b>${short(p.due)}</b><small>${sub}</small></div>`;
}

  const projs=Object.entries(PR).filter(([,p])=>p.status==='active'&&p.due!=null&&inF(p,f)).sort((a,b)=>a[1].due-b[1].due).slice(0,4);
  const d=today.filter(t=>t.done).length;

function viewTodo(){
  const sp=S.space;
  const mine=S.tasks.filter(t=>t.space===sp);
  const today=mine.filter(onToday);
  const cnt=s=>S.tasks.filter(t=>t.space===s&&onToday(t)&&open(t)).length;
  const ev=S.events.filter(e=>e.d===0&&e.space===sp).sort((a,b)=>a.s-b.s);
  const upcoming=mine.filter(t=>open(t)&&!t.someday&&!t.waiting&&t.due!=null&&t.due>0&&t.due<=7&&!onToday(t)).sort((a,b)=>a.due-b.due);
  const noDate=mine.filter(t=>open(t)&&!t.someday&&!t.waiting&&t.due==null);
  const waits=mine.filter(t=>t.waiting&&open(t));
  const some=mine.filter(t=>t.someday);
  let body='';
  if(sp==='personal'){
    const overdue=today.filter(over).sort(byU);
    const rest=today.filter(t=>!over(t)&&!t.repeat);
    const routines=today.filter(t=>t.repeat);
    const groups={};
    rest.forEach(t=>{const k=t.proj?'p:'+t.proj:t.tag?'t:'+t.tag:'x';(groups[k]=groups[k]||[]).push(t)});
    body+=sect('Po termínu',overdue,{hot:true,icon:'flame'});
    Object.entries(groups).forEach(([k,a])=>{
      const [type,id]=k.split(':');
      const title=type==='p'?PR[id].short||PR[id].name:type==='t'?'#'+TAGS[id].name:'Ostatní';
      const hint=type==='t'&&TAGS[id].lead?`ukazuje se ${TAGS[id].lead} dny předem`:'';
      body+=`<section class="sect"><div class="sh">${type==='p'?`<i class="sq" style="--c:${PR[id].color}"></i>`:''}${title}<span class="n">${a.filter(open).length}</span>${hint?`<span class="hint">${hint}</span>`:''}</div>${rows(a.sort(byU),{hideProj:type==='p',hideTag:type==='t',ctx:'today'})}</section>`;
    });
    body+=sect('Rutiny',routines,{icon:'repeat',hideTag:false,ctx:'today',hint:'po odškrtnutí se naplánují znovu'});
  } else {
    const hots=mine.filter(hot).sort(byU);
    const rest=today.filter(t=>!hot(t)).sort(byU);
    body+=sect('Hoří',hots,{hot:true,icon:'flame',hint:'ručně označené a po termínu',empty:'Nic nehoří.'});
    body+=sect('Dnes',rest,{ctx:'today',empty:'Na dnes nic dalšího.'});
  }
  body+=sect('Tento týden',upcoming,{});

function viewProjects(){
  const f=S.pfilter;
  const all=Object.entries(PR).filter(([,p])=>inF(p,f));
  const active=all.filter(([,p])=>p.status==='active');
  const paused=all.filter(([,p])=>p.status==='paused');
  const fin=all.filter(([,p])=>p.status==='done');
  const sortDue=(a,b)=>(a[1].due??999)-(b[1].due??999);
  const prow=([k,p])=>{
    const s=pStats(k),nx=pNext(k),h=pTasks(k).filter(hot).length,w=pTasks(k).filter(t=>t.waiting&&open(t)).length;
    const cur=p.phases&&(p.phases.find(ph=>ph.s<=0&&ph.e>=0)||p.phases.find(ph=>ph.s>0));
    const st=p.status==='paused'?'<span class="status paused"><i></i>Pozastaveno</span>':p.status==='done'?'<span class="status done"><i></i>Hotovo</span>':cur?`<span class="status active"><i></i>${cur.name}</span>`:'<span class="status"><i></i>Bez fází</span>';
    return `<div class="prow" data-proj="${k}">
      <div><div class="pname"><i class="sq" style="--c:${p.color}"></i><b>${p.name}</b></div>
        ${nx?`<div class="pnext">${nx.flame||over(nx)?ic('flame','xs'):''}<span class="lbl">Další:</span><span>${nx.title}</span>${nx.due!=null?`<span class="lbl">· ${dayName(nx.due)}</span>`:''}</div>`:`<div class="pnext"><span class="lbl">${p.status==='done'?'Uzavřený projekt':'Žádný otevřený úkol'}</span></div>`}</div>
      <div class="c-status">${st}</div>
      <div class="c-due">${dueCell(p)}</div>
      <div class="c-prog"><div class="prog" style="--c:${p.color}"><div class="track"><i style="width:${s.n?s.d/s.n*100:0}%"></i></div><span>${s.d}/${s.n}</span></div></div>
      <div class="c-sig sig">${h?`<span class="f" title="Hoří">${ic('flame','xs')}${h}</span>`:''}${w?`<span class="h" title="Čeká na ostatní">${ic('hour','xs')}${w}</span>`:''}${!h&&!w?'<span class="none">—</span>':''}</div>
    </div>`;
  };
  const group=(title,list,o={})=>{
    if(!list.length)return '';
    const isOpen=o.key?!S.collapsed[o.key]:true;
    const head=o.key?`<button class="tog ${isOpen?'open':''}" data-coll="${o.key}">${ic('chev','xs')}${title}<span class="n">${list.length}</span></button>`:`${o.c?`<i class="thr" style="--c:${o.c}"></i>`:''}${title}<span class="n">${list.length}</span>`;
    return `<section class="pgroup"><div class="pgh">${head}</div>${isOpen?`<div class="ptable">${list.sort(sortDue).map(prow).join('')}</div>`:''}</section>`;
  };
  const cntA=Object.values(PR).filter(p=>p.status==='active').length;
  const head=`<div class="ph"><div><div class="eyebrow"><b>${cntA} aktivních</b> · 1 pozastavený · 1 hotový</div><h1 class="d">Projekty</h1></div>
    <div class="actions">${filterSeg('pfilter')}<div class="seg"><button class="${S.pview==='list'?'on':''}" data-seg="pview" data-val="list">${ic('list','s')}Seznam</button><button class="${S.pview==='loom'?'on':''}" data-seg="pview" data-val="loom">${ic('loom','s')}Osnova</button></div><button class="btn pri" data-act="toast" data-msg="Nový projekt: název, prostor, termín a volitelně fáze">${ic('plus','s')}Nový projekt</button></div></div>`;
  if(S.pview==='loom'){
    const lanes=active.filter(([,p])=>p.due!=null).sort(sortDue);
    return head+`<div class="loom">${loom(lanes.map(([k,p])=>{const s=pStats(k);return{label:`<i class="sq" style="--c:${p.color}"></i><span>${p.short||p.name}</span><small>${s.d}/${s.n}</small>`,key:k,c:p.color,s:p.start,e:p.due,prog:s.n?s.d/s.n:0}}),-21,35,'portfolio')}</div>
    <p class="lede" style="font-size:13px;color:var(--t3);margin-top:14px">Každý projekt je jedna nit od začátku po termín. Plná část = hotové úkoly, šrafovaná = zbývá. Svislá čára je dnešek.</p>`;
  }
  return head
    +'<div class="pcol-h"><span>Projekt a další krok</span><span>Fáze</span><span>Termín</span><span>Průběh</span><span style="text-align:right">Signály</span></div>'
    +group('Práce',active.filter(([,p])=>p.space==='work'),{c:'var(--w)'})
    +group('Osobní',active.filter(([,p])=>p.space==='personal'),{c:'var(--p)'})
    +group('Pozastavené',paused,{key:'paused'})
    +group('Hotové',fin,{key:'finished'});
}

/* the loom: lanes of thread bars on a day axis */
function loom(lanes,from,to,mode){
  const span=to-from+1,pct=o=>(o-from)/span*100;
  const weeks=[];for(let o=from;o<=to;o++){if(dOf(o).getDay()===1)weeks.push(o)}
  const cols=weeks.map((o,i)=>{const next=weeks[i+1]??to+1;return `${next-o}fr`});
  const lead0=weeks[0]-from;
  const axis=`<div class="axis" style="grid-template-columns:${mode==='portfolio'?'200px':'170px'} ${lead0?lead0+'fr ':''}${cols.join(' ')}"><div style="border:0"></div>${lead0?'<div></div>':''}${weeks.map(o=>`<div>${dOf(o).getDate()}. ${dOf(o).getMonth()+1}.</div>`).join('')}</div>`;
  const weekend=[];for(let o=from;o<=to;o++){const g=dOf(o).getDay();if(g===6)weekend.push(`<span class="weekend" style="left:${pct(o)}%;width:${2/span*100}%"></span>`)}
  const rowsH=lanes.map(l=>`<div class="lane"><div class="ln" ${l.key?`data-proj="${l.key}"`:''}>${l.label}</div><div class="tr">${weekend.join('')}
      <div class="bar-l ${l.paused?'paused':''}" style="--c:${l.c};left:${pct(Math.max(l.s,from))}%;width:${(Math.min(l.e,to)-Math.max(l.s,from)+1)/span*100}%" ${l.key?`data-proj="${l.key}"`:''} title="${l.title||''}"><i style="width:${l.prog*100}%"></i></div>
      ${l.flag?`<span class="flag" style="--c:${l.c};left:${pct(l.e+1)}%"></span>`:''}
    </div></div>`).join('');
  return `<div class="loom-scroll"><div class="loom-inner">${axis}<div style="position:relative">${rowsH}<div style="position:absolute;top:0;bottom:0;left:${mode==='portfolio'?'200px':'170px'};right:0;pointer-events:none"><span class="needle" data-l="dnes" style="left:${pct(0)+.5/span*100}%"></span></div></div></div></div>`;
}

function viewCal(){

  const head=`<div class="chead"><div></div>${days.map(d=>{const dt=dOf(d);return `<div class="${d===0?'today':''}">${DS[dt.getDay()]}<b>${dt.getDate()}.</b></div>`}).join('')}</div>`;
  const band=`<div class="cband"><div class="lbl">úkoly</div>${days.map(d=>{
    const ts=S.tasks.filter(t=>!t.someday&&t.due===d&&inF(t,f)).sort(byU);
    const shown=ts.slice(0,4);
    return `<div>${shown.map(t=>`<div class="ct ${t.done?'done':''} ${t.flame?'hot':''}" data-open="${t.id}" style="--c:${SP[t.space].c}"><span class="mini" style="border-color:${SP[t.space].c}"></span><span>${t.title}</span></div>`).join('')}${ts.length>4?`<div class="ct" style="background:none;color:var(--t3)">+${ts.length-4} další</div>`:''}</div>`}).join('')}</div>`;
  const hours=[];for(let h=H0;h<H1;h++)hours.push(`<div>${h}:00</div>`);
  const grid=`<div class="cgrid"><div class="hours">${hours.join('')}</div>${days.map(d=>{
    const ev=S.events.filter(e=>e.d===d&&inF(e,f));
    return `<div class="dcol ${d===0?'today':''}" style="height:${(H1-H0)*RH}px">${ev.map(e=>`<div class="ce" style="--c:${e.proj?PR[e.proj].color:SP[e.space].c};top:${(e.s-H0)*RH+1}px;height:${Math.max(24,(e.e-e.s)*RH-3)}px"><b>${e.t}</b>${(e.e-e.s)>=.75?`<time>${fmtH(e.s)}–${fmtH(e.e)}</time>`:''}</div>`).join('')}${d===0?`<span class="nowline" style="top:${(NOW-H0)*RH}px"></span>`:''}</div>`}).join('')}</div>`;
  const agendaM=days.map(d=>{

    return `<section class="sect"><div class="sh">${d===0?'Dnes':d===1?'Zítra':longD(d)}<span class="n">${ev.length+ts.filter(open).length}</span></div>
      <div class="card" style="padding:10px 14px">${ev.map(e=>`<div class="ag"><time>${fmtH(e.s)}</time><span class="bar" style="--c:${SP[e.space].c}"></span><div>${e.t}</div></div>`).join('')}</div>
      ${rows(ts,{thread:true,ctx:'cal'})}</section>`}).join('');
  return `
  <div class="ph"><div><div class="eyebrow"><b>28. září – 4. října</b> · 40. týden</div><h1 class="d">Kalendář</h1></div>

}

      <h4 class="dr-h">Poznámka</h4><div class="note">${t.note||'<span style="color:var(--t3)">Napiš cokoli — odkazy, kontext, co domluvit…</span>'}</div>
    </div>
    <div class="dr-foot"><button class="btn ghost" data-act="toast" data-msg="Přesunuto na zítra">Na zítra</button><button class="btn ghost" data-act="toast" data-msg="Odloženo do Někdy">Někdy</button><span style="flex:1"></span><button class="btn pri" data-done="${t.id}">${t.done?'Vrátit':'Hotovo'}</button></div>
  </aside>`;
}

const NOTES={
  home:['<b>Velký nadpis a jedna věta</b> shrnou den místo lišty s drobným titulkem.','<b>Dvě nitě</b> — Osobní (jadeit) a Práce (okr) — ukazují průběh dne zvlášť.','<b>Program dne</b> je časová osa s jehlou „teď“, ne seznam v krabici.','Seznamy leží přímo na ploše; karty jen pro souhrny vpravo.'],
  todo:['<b>Osobní / Práce jako velké záložky</b> s barevnou nití místo malého přepínače.','<b>Zadávací řádek nahoře</b> — rozumí datu, #tagu i „!“.','<b>Každý význam má vlastní tvar:</b> nit = prostor, čtvereček = projekt, #text = tag, „!“ = vysoká priorita. Žádná barevná tečka navíc.','Úkoly z projektů se v Osobním seskupují pod projektem, volné pod tagem.'],
  cal:['<b>Úkoly jsou konečně v kalendáři</b> — pás „úkoly“ nad mřížkou, jak jsi původně chtěl.','Události jsou barvené podle projektu, bez projektu podle prostoru.','Na telefonu se kalendář mění na přehled po dnech.'],
  projects:['<b>Tabulka místo karet:</b> u každého projektu hned vidíš další krok, stav, termín s odpočtem, průběh a co hoří.','<b>Stav projektu</b> (aktivní / pozastavený / hotový) místo archivace. Pozastavené a hotové jsou sbalené dole.','<b>Pohled Osnova</b> — všechny projekty jako nitě na časové ose. Hned vidíš, co se kde překrývá a co končí.','Seřazeno podle termínu, rozděleno na Práci a Osobní.'],
  project:['<b>Projekt jako stránka:</b> velký název, krátký brief a vlastnosti jako klikací čipy. Prázdná vlastnost je nenápadné „+ Termín“.','<b>Fáze projektu</b> seskupují úkoly (Příprava → Nabídka → Implementace → Předání). Hotová fáze se sbalí sama.','<b>Další krok</b> vpravo nahoře — jedním klikem hotovo.','<b>Osnova</b> ukáže fáze na časové ose s dneškem a termínem.','Kanban je záložka projektu, ne samostatná stránka.','Detail úkolu se otevře z boku a nepřeskočí tě jinam.'],
  refl:['Reflexe zatím jen dostane nový vizuální jazyk.']
};

/* ============ render ============ */
function render(){
  renderSide();renderTabbar();
  const v={home:viewHome,todo:viewTodo,cal:viewCal,projects:viewProjects,project:viewProject,refl:viewRefl}[S.view]();
  document.getElementById('view').innerHTML=v;
  const t=S.drawer?byId(S.drawer):null;
  const key=S.view;
  document.getElementById('layer').innerHTML=(t?drawerHTML(t):'')
    +(S.notes?`<div class="notes" role="dialog" aria-label="Co je jinak"><button class="icon-btn x" data-act="notes">${ic('x','s')}</button><h4>Co je jinak</h4><p>${{home:'Domů',todo:'To-do',cal:'Kalendář',projects:'Projekty',project:'Detail projektu',refl:'Reflexe'}[key]}</p><ul>${NOTES[key].map(n=>`<li>${n}</li>`).join('')}</ul></div>`:'')
    +(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
}
let tt;function toast(m){S.toast=m;clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},2200);render()}
function go(v){S.view=v;S.drawer=null;render();document.getElementById('main').scrollTop=0}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-done],[data-flame],[data-open],[data-nav],[data-proj],[data-seg],[data-space],[data-coll],[data-ptab],[data-step],[data-act]');
  if(!el)return;
  const d=el.dataset;
  if(d.done){const t=byId(d.done);t.done=!t.done;if(t.done&&t.flame)t.flame=false;render();return}
  if(d.flame){const t=byId(d.flame);t.flame=!t.flame;render();return}
  if(d.step){const [id,i]=d.step.split(':');const t=byId(id);t.steps[i][1]=!t.steps[i][1];render();return}
  if(d.open){S.drawer=+d.open;render();return}
  if(d.nav){go(d.nav);return}
  if(d.proj){S.projectId=d.proj;S.ptab='list';go('project');return}
  if(d.seg){S[d.seg]=d.val;render();return}
  if(d.space){S.space=d.space;render();return}
  if(d.coll){const cur=S.collapsed[d.coll];S.collapsed[d.coll]=cur===undefined?(d.default!=='1'):!cur;render();return}
  if(d.ptab){S.ptab=d.ptab;render();return}
  switch(d.act){
    case 'close':S.drawer=null;render();break;
    case 'notes':S.notes=!S.notes;render();break;
    case 'toast':toast(d.msg);break;
    case 'capture':toast('Zachytit: jedno pole, rozumí datu, #tagu, #práce a „!“');break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.drawer||S.notes)){S.drawer=null;S.notes=false;render()}
  if(e.target.id==='qa'&&e.key==='Enter'&&e.target.value.trim()){
    const v=e.target.value.trim();const flame=/(^|\s)!(\s|$)/.test(v);
    S.tasks.push(T(v.replace(/(^|\s)!(\s|$)/,' ').replace(/#\S+/g,'').replace(/\b(zítra|dnes)\b/i,'').replace(/\s+/g,' ').trim()||v,{space:S.space,due:/zítra/i.test(v)?1:0,flame}));
    toast('Přidáno');
  }
});
render();
</script>
</body></html>
